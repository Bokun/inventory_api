import software.amazon.awssdk.auth.credentials.DefaultCredentialsProvider
import io.swagger.codegen.config.CodegenConfigurator
import io.swagger.codegen.DefaultGenerator


buildscript {
    ext {
        awsVersion = '2.55.13'
        // Pinned protoc version; protobuf-java runtime below must stay in sync with it
        protobufVersion = '3.25.9'
        // gRPC 1.84.x depends on protobuf-java 3.25.x, matching protobufVersion
        grpcVersion = '1.84.2'
    }
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        // Only used to resolve AWS credentials for the S3 maven repositories; Gradle handles S3 access itself
        classpath("software.amazon.awssdk:auth:${awsVersion}")
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.0'
        classpath 'io.swagger:swagger-codegen:2.4.52'
    }
}

group 'io.bokun.inventory'
version '0.5.3'

apply plugin: "com.google.protobuf"
apply plugin: "java"
apply plugin: "application"
apply plugin: "idea"
apply plugin: "maven-publish"

def commonArtifact = 'common-api'
def pluginArtifact = 'plugin-api'
def serviceArtifact = 'service-api'

wrapper {
    gradleVersion = '9.8.1'
}

protobuf {
    protoc {
        // The version of protoc must match protobuf-java. If you don't depend on
        // protobuf-java directly, you will be transitively depending on the
        // protobuf-java version that grpc depends on.
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

def swaggerInput = "src/main/swagger/inventory_api.json"
// Overrides of swagger-codegen's built-in Java templates (others fall back to the defaults).
// pojo.mustache is the 2.4.52 template with Boolean getters kept as getX() instead of isX(), for backwards compatibility, and without the
// Swagger annotations (@ApiModel, @ApiModelProperty): their descriptions and required flags go into Javadoc instead.
def swaggerTemplateDir = "src/main/swagger/templates"
def swaggerOutputDir = file('src/generated/main/java')
task generateApi {
    inputs.file(swaggerInput)
        inputs.dir(swaggerTemplateDir)
        outputs.dir(swaggerOutputDir)
        doLast {
            // Previous builds also wrote protoc output here, which would now clash with build/generated/source/proto
            delete(swaggerOutputDir)
            def config = new CodegenConfigurator()
            config.setInputSpec(swaggerInput)
            config.setOutputDir(swaggerOutputDir.path)
            config.setLang('java')
            config.setTemplateDir(file(swaggerTemplateDir).absolutePath)
            config.setAdditionalProperties([
                    'invokerPackage'   : 'io.bokun.inventory.plugin.api.rest',
                    'modelPackage'     : 'io.bokun.inventory.plugin.api.rest',
                    'apiPackage'       : 'io.bokun.inventory.plugin.api.rest',
                    'dateLibrary'      : 'java8',
                    'hideGenerationTimestamp' : 'true',
                    'sourceFolder': '.'
            ])
            config.setSystemProperties([
                    'modelTests': 'false',
                    'modelDocs': 'false',
                    'apiTests': 'false',
                    'apiDocs': 'false',
                    'models' : ''
            ])
            new DefaultGenerator().opts(config.toClientOptInput()).generate()
            // swagger-codegen adds the Swagger annotation imports to every model regardless of the template: drop them
            fileTree(swaggerOutputDir).matching { include '**/*.java' }.each { source ->
                source.text = source.text.replaceAll(/(?m)^import io\.swagger\.annotations\.\w+;\R/, '')
            }
        }
}

clean.doFirst {
    delete(swaggerOutputDir)
}

configurations {
    swagger
}

sourceSets {
    swagger {
        compileClasspath = configurations.swaggerCompileClasspath
        java {
            srcDir file("/src/generated/main/java")
        }
    }
    main {
        java {
            srcDir swaggerOutputDir
        }
        proto {
            srcDir 'src/main/proto_common'
            srcDir 'src/main/proto_plugin'
            srcDir 'src/main/proto_service'
        }
        compileClasspath += swagger.output
        runtimeClasspath += swagger.output
    }
}

dependencies {
    // Only the modules generated code needs; grpc-all would pull in grpc-xds, which forces protobuf-java 4.x
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    // Used by swagger-generated REST models; previously came in transitively via grpc-all
    implementation 'com.google.code.gson:gson:2.14.0'
}

compileSwaggerJava.dependsOn generateApi
classes.dependsOn swaggerClasses
compileJava.dependsOn compileSwaggerJava

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// This thingie below will ensure all dependencies are always fetched when running from IntelliJ
// It should not be there by default and only uncommented when necessary, followed by IntelliJ Gradle refresh

configurations.all {
    resolutionStrategy.cacheDynamicVersionsFor 0, 'hours'
    resolutionStrategy.cacheChangingModulesFor 0, 'hours'
}

if (project.hasProperty('branch')) {
    println("branch: " + project.property('branch'))
}

def awsCredentials = DefaultCredentialsProvider.builder().build().resolveCredentials()

repositories {
    maven {
        url "s3://pmr.bokun.io/snapshots"
        credentials(AwsCredentials) {
            accessKey awsCredentials.accessKeyId()
            secretKey awsCredentials.secretAccessKey()
        }
    }
    mavenLocal()
    mavenCentral()
    maven {
        url "s3://pmr.bokun.io/release"
        credentials(AwsCredentials) {
            accessKey awsCredentials.accessKeyId()
            secretKey awsCredentials.secretAccessKey()
        }
    }
}

idea {
    module {
        sourceDirs += swaggerOutputDir
    }
}

startScripts.enabled = false

task commonApi(type: Jar) {
    archiveBaseName = 'commonapi'
    from sourceSets.main.output.classesDirs
    include 'io/bokun/inventory/common/**', 'io/bokun/inventory/plugin/api/rest/**', 'io/bokun/inventory/util/**'
}

task pluginApi(type: Jar) {
    archiveBaseName = 'pluginapi'
    from sourceSets.main.output.classesDirs
    from sourceSets.swagger.output.classesDirs
    include 'io/bokun/inventory/plugin/**'
}

task serviceApi(type: Jar) {
    archiveBaseName = 'serviceapi'
    from sourceSets.main.output.classesDirs
    from sourceSets.swagger.output.classesDirs
    include 'io/bokun/inventory/service/**', 'grpc/health/v1/**'
}

if (awsCredentials != null) {
    println("publish : " + awsCredentials.accessKeyId())
    publishing {
        println "Will publish to Private S3 repository"
        publications {

            common(MavenPublication) {
                groupId group
                artifactId commonArtifact
                version version
                artifact commonApi
                pom.withXml {
                    asNode().appendNode('description', 'Common GRPC API library for inventory plugin api and inventory service api2')
                }

            }

            plugin(MavenPublication) {
                groupId group
                artifactId pluginArtifact
                version version
                artifact pluginApi

                pom.withXml {
                    asNode().appendNode('description', 'Inventory Service Plugin GRPC API library')

                    def dependenciesNode = asNode().appendNode('dependencies')
                    def dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', group)
                    dependencyNode.appendNode('artifactId', commonArtifact)
                    dependencyNode.appendNode('version', version)
                }
            }
            service(MavenPublication) {
                groupId group
                artifactId serviceArtifact
                version version
                artifact serviceApi

                pom.withXml {
                    asNode().appendNode('description', 'Internal Inventory Service GRPC API library')

                    def dependenciesNode = asNode().appendNode('dependencies')
                    def dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', group)
                    dependencyNode.appendNode('artifactId', commonArtifact)
                    dependencyNode.appendNode('version', version)
                }
            }
        }
        repositories {
            maven {
                url "s3://pmr.bokun.io/release"
                credentials(AwsCredentials) {
                    accessKey awsCredentials.accessKeyId()
                    secretKey awsCredentials.secretAccessKey()
                }
            }
            maven {
                url "s3://public-pmr.bokun.io/release"
                credentials(AwsCredentials) {
                    accessKey awsCredentials.accessKeyId()
                    secretKey awsCredentials.secretAccessKey()
                }
            }
        }
    }
} else {
    println "AWS Credentials not found."
}
